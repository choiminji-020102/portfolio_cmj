<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>커버 — 소담소담</title>
    <link rel="stylesheet" href="cover.css" />
    <style>
      .cover {
        background: #edf2e3;
      }

      /*
        이 커버만 CSS 폰 목업을 쓰지 않는다 — 넣는 이미지에 기기 프레임이
        이미 그려져 있어 목업을 씌우면 폰 안에 폰이 들어간다.

        발표자료 슬라이드에서 검은 여백을 걷어내고 바깥 흰 배경을 투명하게
        만든 이미지다(scratchpad/crop.py). 폰 2대·점선·말풍선·캐릭터가 한 장에
        들어 있어 자르지 않고 통째로 건다 — 어느 하나도 잘리지 않게.
      */
      .art {
        display: block;
        height: 590px;
        width: auto;
      }

      /* 카피 아래 빈 자리를 채우는 캐릭터(챗봇 '소담이').
         바깥 사각 배경은 지웠고 원형 뱃지만 남아 있다 */
      .character {
        display: block;
        width: 158px;
        margin-top: 38px;
      }
    </style>
  </head>
  <body>
    <!-- 이미지 오른쪽 · 카피 왼쪽 -->
    <div class="cover">
      <div class="copy">
        <p class="eyebrow">창업경진대회 · 우수상</p>
        <h1 class="title">소담소담</h1>
        <p class="desc">
          센서 없이 <b>AI 분석만으로</b><br />
          젖소를 관리하는 앱.
        </p>
        <img class="character" src="../../public/sodam/character.png" alt="" />
      </div>

      <div class="stage">
        <img class="art" src="../../public/sodam/chatbot-phones.png" alt="" />
      </div>
    </div>
  </body>
</html>
