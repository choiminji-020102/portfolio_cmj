<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>커버 — 초음파 다중 구조물 검출</title>
    <link rel="stylesheet" href="cover.css" />
    <style>
      .cover {
        background: #e2eef1;
      }

      /*
        원본 초음파 영상은 공개 가능 여부가 확정되지 않아 파이프라인
        다이어그램을 대신 넣는다. 도형과 글자로만 이뤄져 있어 확대하면
        오히려 읽히므로, 잘라내지 않고 화면 폭에 맞춰 크게 건다.
        영상 캡처를 쓰게 되면 --zoom 을 1.4 안팎으로 올리면 된다.
      */
      .shot {
        --zoom: 1;
        --focus: top center;
      }
    </style>
  </head>
  <body>
    <!-- 목업 왼쪽 · 카피 오른쪽 (flip) -->
    <div class="cover flip">
      <div class="copy">
        <p class="eyebrow">삼성메디슨 · 인턴</p>
        <h1 class="title sm">초음파<br />다중 구조물 검출</h1>
        <p class="desc">
          초음파 6개 구조물 검출.<br />
          성능 병목이<br />
          <b>정답 데이터에 있음을 규명</b>
        </p>
      </div>

      <div class="stage">
        <div class="monitor">
          <div class="screen">
            <div class="shot">
              <img
                src="../../public/samsung-medison/pipeline-representative-crop.svg"
                alt=""
              />
            </div>
          </div>
          <div class="neck"></div>
          <div class="foot"></div>
        </div>
      </div>
    </div>
  </body>
</html>
