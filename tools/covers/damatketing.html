<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>커버 — 다 맡케팅</title>
    <link rel="stylesheet" href="cover.css" />
    <style>
      .cover {
        background: #ede9f6;
      }

      /* 확대하지 않는다 — 화면 전체가 다 보이게 둔다 */
      .shot {
        --zoom: 1;
        --focus: top center;
      }

      /* 노트북이 무대보다 넓다 — 왼쪽 로고까지 잘리지 않게 안으로 당긴다 */
      .laptop {
        transform: translateX(26px);
      }
    </style>
  </head>
  <body>
    <!-- 목업 왼쪽 · 카피 오른쪽 (flip) -->
    <div class="cover flip">
      <div class="copy">
        <p class="eyebrow">KT AIVLE · 대상</p>
        <h1 class="title">다 맡케팅</h1>
        <p class="desc">
          쇼츠 제작부터 SNS 게시까지<br />
          <b>생성형 AI로 자동화</b>한<br />
          소상공인 마케팅 플랫폼.
        </p>
      </div>

      <div class="stage">
        <div class="laptop">
          <div class="screen">
            <!-- post-upload.png 는 1400×2432 라 노트북(16:10)에 넣으면 상단만
                 남는다. 가로 비율이 맞는 post-manage.png 를 쓴다 -->
            <div class="shot">
              <img src="../../public/damatketing/post-manage.png" alt="" />
            </div>
          </div>
          <div class="base"></div>
        </div>
      </div>
    </div>
  </body>
</html>
