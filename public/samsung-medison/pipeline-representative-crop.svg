<svg width="680" height="356" viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>데이터 처리 파이프라인과 영상 단위 대표 크롭</title>
  <desc>AVI에서 프레임을 추출해 크롭, 어노테이션, 학습으로 이어지는 파이프라인과, 프레임별 유효 영역 크기의 최빈값을 영상 전체의 대표 크롭 크기로 채택하는 방식.</desc>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5668" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="44" y="40" width="104" height="40" rx="6" fill="#eaf0f8" stroke="#4d6d9f" stroke-width="0.5"/>
  <text x="96" y="65" font-size="13" fill="#3a5478" text-anchor="middle">AVI</text>
  <line x1="152" y1="60" x2="166" y2="60" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="166" y="40" width="104" height="40" rx="6" fill="#eaf0f8" stroke="#4d6d9f" stroke-width="0.5"/>
  <text x="218" y="65" font-size="13" fill="#3a5478" text-anchor="middle">프레임 추출</text>
  <line x1="274" y1="60" x2="288" y2="60" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="288" y="40" width="104" height="40" rx="6" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="340" y="65" font-size="13" fill="#2f6376" text-anchor="middle">크롭</text>
  <line x1="396" y1="60" x2="410" y2="60" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="410" y="40" width="104" height="40" rx="6" fill="#eaf0f8" stroke="#4d6d9f" stroke-width="0.5"/>
  <text x="462" y="65" font-size="13" fill="#3a5478" text-anchor="middle">어노테이션</text>
  <line x1="518" y1="60" x2="532" y2="60" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="532" y="40" width="104" height="40" rx="6" fill="#eaf0f8" stroke="#4d6d9f" stroke-width="0.5"/>
  <text x="584" y="65" font-size="13" fill="#3a5478" text-anchor="middle">학습</text>

  <text x="196" y="102" font-size="12" fill="#5f5668">약 500 프레임 중 20~300 구간만</text>

  <line x1="340" y1="118" x2="340" y2="140" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <text x="44" y="168" font-size="12" fill="#5f5668">largest contour의 boundingRect 좌표(startX, startY, boxW, boxH)가 프레임마다 다르다</text>

  <rect x="44" y="182" width="90" height="62" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <rect x="54" y="192" width="70" height="42" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="89" y="262" font-size="12" fill="#2f6376" text-anchor="middle">좌표 A</text>

  <rect x="154" y="182" width="90" height="62" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <rect x="164" y="192" width="70" height="42" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="199" y="262" font-size="12" fill="#2f6376" text-anchor="middle">좌표 A</text>

  <rect x="264" y="182" width="90" height="62" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <rect x="282" y="196" width="70" height="42" fill="#f6f0e2" stroke="#7d5a1c" stroke-width="0.5"/>
  <text x="309" y="262" font-size="12" fill="#7d5a1c" text-anchor="middle">좌표 B</text>

  <rect x="374" y="182" width="90" height="62" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <rect x="384" y="192" width="70" height="42" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="419" y="262" font-size="12" fill="#2f6376" text-anchor="middle">좌표 A</text>

  <rect x="484" y="182" width="90" height="62" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <rect x="494" y="194" width="60" height="34" fill="#f6f0e2" stroke="#7d5a1c" stroke-width="0.5"/>
  <text x="529" y="262" font-size="12" fill="#7d5a1c" text-anchor="middle">좌표 C</text>

  <text x="596" y="219" font-size="13" fill="#5f5668">…</text>

  <line x1="340" y1="276" x2="340" y2="298" stroke="#5f5668" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="44" y="304" width="592" height="40" rx="6" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="340" y="329" font-size="13" fill="#2f6376" text-anchor="middle">최빈값(좌표 A)을 이 영상의 대표 크롭 크기로 채택 → 전 프레임에 동일 적용</text>
</svg>
