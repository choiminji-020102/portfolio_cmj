<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>outside 속성이 붙은 어노테이션의 좌표 문제</title>
  <desc>outside가 1이어도 좌표 필드는 채워져 있고, 그 값이 이미지 범위를 벗어나 정규화하면 1을 초과한다.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5668" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="12" fill="#5f5668">XML 어노테이션</text>
  <rect x="40" y="54" width="600" height="72" rx="4" fill="#f3f2f6" stroke="#cdc9d4" stroke-width="0.5"/>
  <text x="60" y="82" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a132f">&lt;points frame="142" outside="1" points="1100.0,340.5 1118.2,352.7 ..." /&gt;</text>
  <text x="60" y="106" font-size="12" fill="#8f4522">outside = 1 (이 프레임에 객체 없음) — 그런데 좌표 필드는 그대로 채워져 있다</text>

  <line x1="340" y1="126" x2="340" y2="158" stroke="#5f5668" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="40" y="182" font-size="12" fill="#5f5668">이미지 가로 범위 (900px)</text>
  <rect x="40" y="196" width="360" height="86" fill="#e3f0f4" stroke="#3d7f97" stroke-width="0.5"/>
  <text x="46" y="298" font-size="12" fill="#5f5668">0</text>
  <text x="392" y="298" font-size="12" fill="#5f5668">900</text>
  <line x1="400" y1="196" x2="400" y2="290" stroke="#3d7f97" stroke-width="0.5" stroke-dasharray="4 4"/>
  <circle cx="480" cy="239" r="5" fill="#c04a49"/>
  <text x="494" y="243" font-size="12" fill="#92312f">x = 1100 — 이미지 밖</text>
  <text x="40" y="322" font-size="12" fill="#5f5668">1100 ÷ 900 = 1.22 → 정규화 유효 범위(0~1) 초과</text>

  <text x="494" y="265" font-size="12" fill="#5f5668">좌표만으로는 유효한</text>
  <text x="494" y="283" font-size="12" fill="#5f5668">어노테이션과 구분 불가</text>
</svg>
