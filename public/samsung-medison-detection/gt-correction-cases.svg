<svg viewBox="0 0 1360 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>GT 보정 두 가지 사례</title>
  <desc>넓게 칠해진 GT는 실제 경계에 맞춰 다시 그리고, 겹쳐서 하나로 칠해진 두 난포는 앞쪽 난포의 경계선을 따라 지워 원과 반달로 분리한다.</desc>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5668"/>
    </marker>
  </defs>

  <!-- 사례 1: 넓게 칠해진 경계 -->
  <text x="60" y="50" font-size="20" font-weight="700" fill="#c2603a" letter-spacing="0.02em">사례 1</text>

  <g>
    <path d="M 304.5 187.0 C 305.6 197.6, 302.8 214.7, 295.9 224.1 C 288.9 233.5, 272.8 237.5, 262.9 243.2 C 252.9 249.0, 246.3 259.6, 236.2 258.6 C 226.2 257.6, 212.3 246.6, 202.5 237.2 C 192.8 227.9, 181.4 213.9, 177.6 202.4 C 173.9 190.9, 176.0 178.1, 180.1 168.4 C 184.2 158.7, 193.8 152.2, 202.4 144.4 C 211.0 136.5, 220.9 123.9, 231.8 121.3 C 242.8 118.7, 258.6 122.3, 268.2 128.8 C 277.9 135.3, 283.6 150.5, 289.6 160.2 C 295.7 169.9, 303.5 176.3, 304.5 187.0 Z"
          fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="240" cy="190" r="55" fill="none" stroke="#c2603a" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="240" y="410" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">넓게 칠해진 GT</text>
    <text x="240" y="440" text-anchor="middle" font-size="22" fill="#5f5668">주황 점선이 실제 난포 경계</text>
  </g>

  <line x1="440" y1="210" x2="510" y2="210" stroke="#5f5668" stroke-width="2.5" marker-end="url(#ar3)"/>

  <g>
    <circle cx="650" cy="190" r="55" fill="#3d7f97" fill-opacity="0.16" stroke="#3d7f97" stroke-width="3"/>
    <text x="650" y="410" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">경계에 맞춰 보정</text>
    <text x="650" y="440" text-anchor="middle" font-size="22" fill="#5f5668">실제 크기만큼만 남긴다</text>
  </g>

  <line x1="0" y1="490" x2="1360" y2="490" stroke="#e6e4ea" stroke-width="1"/>

  <!-- 사례 2: 겹쳐서 하나로 칠해진 GT -->
  <text x="60" y="545" font-size="20" font-weight="700" fill="#c2603a" letter-spacing="0.02em">사례 2</text>

  <!-- before: A와 B가 겹친 채 하나의 마스크 -->
  <g>
    <path d="M 226.0 612.7 A 66 66 0 1 0 226.0 707.3 A 66 66 0 1 0 226.0 612.7 Z" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3" stroke-linejoin="round"/>
    <text x="160" y="666" text-anchor="middle" font-size="21" fill="#3d7f97" font-weight="700">A</text>
    <text x="292" y="666" text-anchor="middle" font-size="21" fill="#3d7f97" font-weight="700">B</text>
    <text x="226" y="790" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">겹친 채 하나로 칠해진 GT</text>
    <text x="226" y="820" text-anchor="middle" font-size="22" fill="#5f5668">두 난포가 한 덩어리</text>
  </g>

  <line x1="390" y1="660" x2="450" y2="660" stroke="#5f5668" stroke-width="2.5" marker-end="url(#ar3)"/>

  <!-- during: A 경계선을 따라 지움 -->
  <g>
    <circle cx="580" cy="660" r="66" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3"/>
    <circle cx="672" cy="660" r="66" fill="#3d7f97" fill-opacity="0.08" stroke="#3d7f97" stroke-width="2" stroke-dasharray="2 4" stroke-opacity="0.6"/>
    <path d="M 626 613 A 66 66 0 0 1 626 707" fill="none" stroke="#c2603a" stroke-width="5"/>
    <text x="560" y="666" text-anchor="middle" font-size="21" fill="#3d7f97" font-weight="700">A</text>
    <text x="626" y="790" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">A의 경계선을 따라 지움</text>
    <text x="626" y="820" text-anchor="middle" font-size="22" fill="#5f5668">겹친 자리에 선 하나만 지운다</text>
  </g>

  <line x1="790" y1="660" x2="850" y2="660" stroke="#5f5668" stroke-width="2.5" marker-end="url(#ar3)"/>

  <!-- after: A는 온전한 원, B는 반달 -->
  <g>
    <!-- B 전체를 먼저 칠하고 -->
    <circle cx="1072" cy="660" r="66" fill="#c2603a" fill-opacity="0.2" stroke="#c2603a" stroke-width="3"/>
    <!-- A로 덮어 겹친 부분을 가림 -->
    <circle cx="980" cy="660" r="66" fill="#ffffff"/>
    <circle cx="980" cy="660" r="66" fill="#3d7f97" fill-opacity="0.16" stroke="#3d7f97" stroke-width="3"/>
    <text x="960" y="666" text-anchor="middle" font-size="21" fill="#3d7f97" font-weight="700">A</text>
    <text x="1075" y="666" text-anchor="middle" font-size="21" fill="#c2603a" font-weight="700">B</text>
    <text x="1015" y="790" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">A는 원, B는 반달로 분리</text>
    <text x="1015" y="820" text-anchor="middle" font-size="22" fill="#5f5668">B에는 A 밖의 부분만 남는다</text>
  </g>
</svg>
