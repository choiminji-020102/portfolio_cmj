<svg viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>가려짐으로 남는 반달 모양</title>
  <desc>실제로는 온전한 원인 난포 두 개가 초음파에서 하나가 다른 하나에 가려 GT에는 반달 모양으로만 표시된다.</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5668"/>
    </marker>
  </defs>

  <!-- ① 실제 상황: 난포 두 개가 나란히 -->
  <g>
    <circle cx="220" cy="255" r="78" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3"/>
    <circle cx="330" cy="255" r="78" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3"/>
    <text x="220" y="260" text-anchor="middle" font-size="20" fill="#3d7f97" font-weight="700">A</text>
    <text x="330" y="260" text-anchor="middle" font-size="20" fill="#3d7f97" font-weight="700">B</text>
    <text x="275" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">실제: 난포 두 개가 나란히</text>
    <text x="275" y="502" text-anchor="middle" font-size="22" fill="#5f5668">두 개 모두 온전한 원</text>
  </g>

  <line x1="450" y1="270" x2="510" y2="270" stroke="#5f5668" stroke-width="2.5" marker-end="url(#ar2)"/>

  <!-- ② 초음파 상: B가 A에 가려 경계가 흐려짐 -->
  <g>
    <circle cx="640" cy="255" r="78" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3"/>
    <path d="M 750 255 A 78 78 0 1 1 749.9 255"
          fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3" stroke-dasharray="3 5" opacity="0.55"/>
    <path d="M 700 194 A 78 78 0 0 1 700 316" fill="none" stroke="#c2603a" stroke-width="3.5" stroke-dasharray="5 4"/>
    <text x="640" y="260" text-anchor="middle" font-size="20" fill="#3d7f97" font-weight="700">A</text>
    <text x="722" y="260" text-anchor="middle" font-size="20" fill="#716d7e" font-weight="700">B</text>
    <text x="695" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">초음파: B의 경계가 흐려짐</text>
    <text x="695" y="502" text-anchor="middle" font-size="22" fill="#5f5668">A에 가려 B의 왼쪽 절반이 안 보인다</text>
  </g>

  <line x1="870" y1="270" x2="930" y2="270" stroke="#5f5668" stroke-width="2.5" marker-end="url(#ar2)"/>

  <!-- ③ 잘못된 GT: 반달 모양으로 레이블링 -->
  <g>
    <circle cx="1060" cy="255" r="78" fill="#3d7f97" fill-opacity="0.14" stroke="#3d7f97" stroke-width="3"/>
    <path d="M 1160 194 A 78 78 0 0 1 1160 316 Z" fill="#c2603a" fill-opacity="0.22" stroke="#c2603a" stroke-width="3.5"/>
    <text x="1060" y="260" text-anchor="middle" font-size="20" fill="#3d7f97" font-weight="700">A</text>
    <text x="1175" y="260" text-anchor="middle" font-size="20" fill="#c2603a" font-weight="700">B</text>
    <text x="1115" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#1a132f">GT: 반달 모양으로 레이블링</text>
    <text x="1115" y="502" text-anchor="middle" font-size="22" fill="#5f5668">보이는 경계까지만 표시 — 가려진 부분은 알 수 없다</text>
  </g>
</svg>
